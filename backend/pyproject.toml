[project]
name = "chandlerai-backend"
version = "1.0.0"
description = "agno AgentOS server that generates mobile-friendly HTML apps on demand"
requires-python = ">=3.13"
dependencies = [
    "agno==2.8.7",
    "google-genai>=2.17.0",
    "sqlalchemy>=2.0.51",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false
